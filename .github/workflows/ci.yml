name: LocalStay Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore LocalStay.slnx

      - name: Build Solution
        run: dotnet build LocalStay.slnx --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test LocalStay.slnx --no-build --configuration Release --verbosity normal
